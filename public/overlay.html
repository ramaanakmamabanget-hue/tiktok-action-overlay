<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auction Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/overlay.css">
</head>
<body class="overlay-body">
<div class="overlay-root" id="overlayRoot">

  <div class="frame frame-title shiny"><span class="title-star">★</span><span id="overlayTitle">AUCTION</span></div>

  <div class="frame frame-min shiny"><span class="check" id="minimumIcon">✔</span><span id="minimumText">NO MINIMUM</span></div>

  <div class="frame frame-prize shiny"><span id="prizeText" class="rainbow-text">PRIZE #1</span></div>

  <div class="stack" id="stack">
  <div id="overtaken" class="overtaken"><b>OVERTAKEN!</b><small id="overtakenName"></small></div>
  <div id="bigCount" class="big-count"></div>
  <div id="fx" class="fx"></div>
  <canvas id="fxc" class="fxc"></canvas>
  <div id="giftAlert" class="gift-alert">
    <img id="giftAvatar" class="ga-avatar" src="" alt="">
    <div class="ga-text"><small id="giftTag" class="ga-tag">GIFT</small><b id="giftName" class="ga-name"></b></div>
    <div class="ga-amt"><span id="giftAmt">+0</span><i class="coin"></i></div>
    <span id="giftCombo" class="ga-combo"></span>
  </div>
  <canvas id="confetti" class="confetti"></canvas>
  <div class="frame frame-main">
    <div class="timer-head shiny-soft">
      <span id="phaseLabel" class="phase-label">WAITING</span>
      <strong id="timer" class="timer">00:00</strong>
    </div>
    <div id="rows" class="ov-rows"></div>
    <div class="participants"><span class="pill shiny"><i class="people"></i><span id="participantsText">Total participants: 0</span></span></div>
  </div>


  <div id="winnerPanel" class="frame winner-panel shiny hidden">
    <div class="rays"></div>
    <div id="sparkles" class="sparkles"></div>
    <div class="winner-content">
      <div class="crown">👑</div>
      <div class="winner-avatar-wrap"><div class="ring"></div><img id="winnerAvatar" class="winner-avatar" src="" alt=""></div>
      <div class="winner-kicker"><span class="tro">🏆</span> WINNER <span class="tro">🏆</span></div>
      <strong id="winnerName">—</strong>
      <div class="winner-badges">
        <span class="wbadge"><span id="winnerCoins">0</span><i class="coin"></i></span>
        <span class="wbadge prize"><span class="gift">🎁</span><span id="winnerPrize" class="rainbow-text">PRIZE</span></span>
      </div>
      <div class="winner-chat-label">Winner Chat</div>
      <div class="winner-chat-row">
        <div id="winnerChat" class="winner-chat">
          <img id="winnerChatAvatar" class="winner-chat-avatar" src="" alt="">
          <div class="winner-chat-content"><span id="winnerChatUser" class="winner-chat-user">Winner</span><span class="winner-chat-colon">:</span><span id="winnerChatText" class="winner-chat-text">Waiting for winner chat…</span></div>
        </div>
        <button id="winnerChatCopy" class="winner-chat-copy" type="button" aria-label="Copy winner chat">Copy</button>
      </div>
    </div>
  </div>
  </div>

</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/fx.js"></script>
<script src="/overlay.js"></script>
</body>
</html>
